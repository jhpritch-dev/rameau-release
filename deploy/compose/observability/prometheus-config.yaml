apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: inference-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'bifrost-router'
        scrape_interval: 5s
        metrics_path: '/metrics'
        static_configs:
          - targets: ['127.0.0.1:8080']
            labels:
              instance: 'bifrost'
              service: 'router'

      - job_name: 'ollama-bifrost'
        scrape_interval: 15s
        metrics_path: '/metrics'
        static_configs:
          - targets: ['127.0.0.1:11434']
            labels:
              instance: 'bifrost'
              service: 'ollama'
