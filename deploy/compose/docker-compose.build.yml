# =============================================================================
# docker-compose.build.yml  --  BIFROST BUILD AND DEV-LOOP DESCRIPTOR
# P13, 2026-10-05.
# =============================================================================
#
# ROLE. John settled the descriptor question on 2026-10-05: SPLIT BY ROLE.
#   * THIS FILE is the BUILD and DEV-LOOP descriptor. Its job is to build each
#     in-scope unit from its Dockerfile and run it on one host, with no cluster,
#     no registry and no `k3d image import`, so a fleet model can test one unit
#     unaided.
#   * k3d + Flux remains the RUNTIME descriptor for the control plane.
# This file is NOT a production runtime descriptor and must never be treated as
# one. The three reasons it CANNOT be are recorded in full below, because a
# future reader who does not know them will try.
#
# -----------------------------------------------------------------------------
# WHY COMPOSE IS INSUFFICIENT AS A RUNTIME DESCRIPTOR -- THREE FACTS
# -----------------------------------------------------------------------------
#
# (1) NETWORKPOLICY IS UNEXPRESSIBLE, AND IT IS LOAD-BEARING.
#     execsvc's post-breach containment is two k8s NetworkPolicy objects in
#     bifrost-platform/k8s/base/sandbox/sandbox-netpol.yaml:
#         deny-all       podSelector {} -- EVERY pod, Ingress + Egress, NO rules.
#                        The empty spec IS the deny.
#         execsvc-allow  podSelector app=execsvc;
#                        egress: UDP 53 + TCP 53, namespaceSelector {} (in-cluster
#                                DNS only -- nothing else, no LAN, no internet);
#                        ingress: TCP 8000 only.
#     That hardening removed LAN /24 egress after the 2026-07-31 OpenAI/HF breach
#     review. Compose has no NetworkPolicy. `internal: true` on a network (used
#     for execsvc below) blocks egress to the outside world but is NOT the same
#     control: it does not express DNS-only, it does not scope by namespace, and
#     it does not deny intra-network traffic. Running execsvc under THIS file
#     therefore runs it with WEAKER containment than production. Do not conclude
#     from a green dev-loop run that the sandbox is contained.
#
# (2) K3D CARRIES PRODUCTION STATE AND RECONCILES WITH `prune: true`.
#     bifrost-platform/flux/flux-system/gotk-sync.yaml declares a GitRepository
#     at ssh://git@github.com/jhpritch-dev/bifrost-platform, branch main,
#     path ./flux, interval 1m0s, and the flux-system Kustomization sets
#     prune: true. Two child Kustomizations reconcile every 5m, both prune: true:
#         inference-platform -> ./k8s/base/inference-platform
#         sandbox            -> ./k8s/base/sandbox
#     prune: true can DELETE. The sandbox kustomization deliberately does not own
#     its own Namespace precisely so a bad commit cannot take execsvc with it --
#     preserve that property.
#
# (3) FLUX IS LIVE ON K3D BUT SOURCED FROM `bifrost-platform`, NOT RAMEAU.
#     Verified against the real Flux source in this capture, not RAMEAU's copy:
#     the GitRepository url above is the bifrost-platform repo. RAMEAU's
#     deploy\flux and deploy\k8s trees are a VENDORED COPY.
#     ==> A RAMEAU COMMIT RECONCILES NOTHING TODAY. A change committed there will
#     appear to deploy and will not. This is the open operator question that gates
#     P14: does the GitOps source of truth stay in bifrost-platform, or move into
#     RAMEAU? It is unanswered as of 2026-10-05.
#
# -----------------------------------------------------------------------------
# RECORDED, NOT FIXED -- two runtime-descriptor defects this file does not touch
# -----------------------------------------------------------------------------
#
# (A) ONLY 5 OF 13 UNITS ARE IN A KUSTOMIZATION, AND THE ROUTER IS IN NONE.
#     bifrost-platform/k8s/base/inference-platform/kustomization.yaml lists
#     exactly: observer-config, observer, broadcaster, arbiter-deployment,
#     arbiter-external. The sandbox kustomization lists exactly sandbox-netpol.
#     `grep -rn bifrost-router --include=kustomization.yaml` over the Flux source
#     returns NOTHING (exit 1), while the control positive `broadcaster` returns
#     kustomization.yaml:8 -- so the absence is measured, not a failed grep.
#     bifrost-router.yaml SITS IN THAT DIRECTORY and is not listed, which is the
#     worst version of the problem: it looks managed and is not.
#     execsvc and the Session-O CronJob are likewise in no kustomization.
#
# (B) THE ROUTER'S ENV WAS SET IMPERATIVELY AND A REBUILD WOULD LOSE IT.
#     bifrost-router/k8s/bifrost-router-deployment.yaml:8-9, its own words:
#       "every inline env var and the current registry image were added
#        imperatively via `kubectl set env` / `set image`. A cluster rebuild
#        would have silently lost all of them."
#     Line 148 records a routing threshold "applied live via `kubectl set env`"
#     and only WRITTEN DOWN in the manifest. So the manifest is a capture of
#     imperative state and may already be stale. P14's real test is comparing it
#     to `kubectl set env --list` on the live Deployment BEFORE applying anything.
#     This file does not and must not attempt to fix that.
#
# -----------------------------------------------------------------------------
# PATHS: LOGICAL VOLUMES ONLY -- NO DRIVE LETTER APPEARS BELOW
# -----------------------------------------------------------------------------
# Every host path is a ${BIFROST_VOL_*} from P1 (VOLUME-MAP-2026-10-05.md). The
# `:?` form is deliberate: an unset volume FAILS the render instead of silently
# defaulting. P1's finding is that a silent default writes to the wrong place and
# the service still answers /health. `docker compose config` therefore REQUIRES a
# populated .env -- that is the feature, not a defect. Copy .env.example to .env
# and fill in the host's literals.
#
# Acceptance: the rendered config must contain ZERO drive-letter binds.
#   docker compose -f docker-compose.build.yml config | grep -nE '[A-Za-z]:[\\/]'
#   -> must be empty.
#
# -----------------------------------------------------------------------------
# DOCKERFILES: WHICH ONES I ASSUMED
# -----------------------------------------------------------------------------
# SIX are staged by the peer agent in _build/<unit>/ and are referenced here by
# relative path. I did not write or edit any of them. Each declares its own build
# context in its header, and this file uses exactly the context it declares:
#     _build/router/Dockerfile        context: bifrost-router repo ROOT
#                                     EXPOSE 8080, uvicorn main:app, ARG BIFROST_COMMIT
#     _build/arbiter/Dockerfile       context: bifrost-router repo ROOT     EXPOSE 8082
#     _build/shell-mcp/Dockerfile     context: bifrost-router repo ROOT     EXPOSE 8086
#     _build/portal/Dockerfile        context: bifrost-platform/bifrost-portal/
#                                     NEWLY AUTHORED multi-stage, + its own nginx.conf
#                                     node:20-alpine build -> nginx:alpine   EXPOSE 80
#     _build/broadcaster/Dockerfile   context: bifrost-platform/control-plane/broadcaster/
#                                     EXPOSE 8090
#     _build/observer/Dockerfile      context: bifrost-platform/docker/observer/
#                                     EXPOSE 8081
# TWO are PRE-EXISTING in the staged repos, with no _build/ staging yet:
#     bifrost-platform/bifrost-kb/Dockerfile          CMD uvicorn pipeline:app :8090
#     bifrost-platform/execsvc/Dockerfile             EXPOSE 8000
#
# CONTEXT NARROWING IS HANDLED, and an earlier draft of this file was WRONG about
# it. BuildKit resolves `<dockerfile-path>.dockerignore` before
# `<context>/.dockerignore`, and the peer agent stages the file under BOTH names
# in every unit dir (`.dockerignore` for an in-repo build, `Dockerfile.dockerignore`
# for the out-of-tree `-f _build/...` build this compose file performs). So the
# narrowed context IS applied as staged -- router 67 files / 1.78 MB rather than
# 578 / 19.6 MB. Verify after any change to those files:
#     docker build --no-cache -f _build/router/Dockerfile ../bifrost-router \
#       2>&1 | grep -i 'transferring context'
#
# >>> execsvc: build from bifrost-platform/execsvc/, NOT control-plane/execsvc/. <<<
#     bifrost-platform/control-plane/execsvc/Dockerfile line 14 ends in TWO
#     backslash bytes (`pytest \\`), which is a literal backslash and not a line
#     continuation, so ` && python -c ...` parses as its own instruction and the
#     build fails. The sibling bifrost-platform/execsvc/Dockerfile has a single
#     backslash, is correct, and is the copy with vendor/ beside it. The peer
#     agent reached the same conclusion independently and staged a corrected
#     variant at _build/_defect-fixes/control-plane-execsvc-Dockerfile.CORRECTED
#     (their D4). This file builds the known-good sibling.
#
# -----------------------------------------------------------------------------
# OUT OF SCOPE
# -----------------------------------------------------------------------------
#   * autoagent-sourced units, per John ("leave autoagent out for now"):
#     Session-O / harness, inhouse_retriever.py (RAG retriever), Telegram bot.
#   * The homelab's other compose services (immich, owncloud, home-assistant,
#     jellyfin, duplicati, caddy, n8n, langfuse, searxng, qdrant,
#     unstructured-api). They are supporting services, not BIFROST units.
#   * (The PORTAL was in this list in an earlier draft. It is now IN scope and
#     enabled below: the peer agent landed _build/portal/Dockerfile + nginx.conf.)
#   * KB bridges / enrichment-api: no source in the staged repos (gap S1).
# =============================================================================

name: bifrost-build

# -----------------------------------------------------------------------------
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-env: &default-env
  # Optional so `docker compose config` validates on a clean checkout. The units
  # that actually need a secret are the router, the arbiter and the paperless
  # bridge; six of the eleven in-scope units need none (SECRET-INJECTION §1).
  - path: .env
    required: false

services:
  # PORT BLOCK (2026-10-13, John, DECISIONS-john-60 row 44: "(a) 2nd port block").
  # Every published port defaults to a LOOPBACK-bound 181xx/13110 port, so this
  # stack runs BESIDE the live Hearth services for comparison and collides with
  # none of them (8080/8081/8091/8092/8095/3110 are all bound by the live estate;
  # 18080-18095 and 13110 were free on Hearth when this was written). Cutover is a
  # deliberate env override per service, e.g. ROUTER_PORT=8080 -- never an edit
  # back to a bare live port here. ARBITER keeps 127.0.0.1:18082 (8082 = board).

  # ===========================================================================
  # ROUTER / control plane.  Dockerfile ASSUMED (peer agent).
  # ===========================================================================
  router:
    build:
      context: ../src/bifrost-router
      dockerfile: ../../docker/router/Dockerfile
      args:
        # Build args are NEVER secrets: they are baked into the image and are
        # readable with `docker history`. This one is a commit SHA, which is fine.
        BIFROST_COMMIT: ${BIFROST_COMMIT:-f5e6ca3}
    image: bifrost-router:dev
    env_file: *default-env
    environment:
      # --- P1 volume roots, as seen from INSIDE the container -----------------
      BIFROST_PATH_MODE: container
      BIFROST_VOL_NETSSD: /net-ssd
      BIFROST_VOL_DOCS: /data/ai-cloud
      BIFROST_VOL_SCRATCH: /scratch
      BIFROST_TELEMETRY_DIR: /net-ssd/bifrost-logs/v120-telemetry
      # --- host boundary: inference STAYS ON THE HOST, the container gets a URL
      # Never /dev/kfd, never /dev/dri, never /dev/accel. Hearth's ollama is
      # pinned at 0.30.8 below the gfx1010 removal and the pin is protective.
      BIFROST_OLLAMA_URL: ${BIFROST_OLLAMA_URL:?set the host ollama URL; a container must never reach a host loopback}
      ARBITER_URL: http://arbiter:8082
      BROADCASTER_URL: http://broadcaster:8090
      OBSERVER_URL: http://observer:8081
      BIFROST_KB_URL: http://bifrost-kb:8090
    volumes:
      - ${BIFROST_VOL_NETSSD:?unset - see VOLUME-MAP-2026-10-05.md}/bifrost-logs:/net-ssd/bifrost-logs:rw
      - ${BIFROST_VOL_DOCS:?unset - see VOLUME-MAP-2026-10-05.md}:/data/ai-cloud:ro
    ports:
      - "${ROUTER_PORT:-127.0.0.1:18080}:8080"
    networks: [bifrost]
    logging: *default-logging
    restart: "no"          # dev loop: a crash should be visible, not hidden
    # NOTE: no healthcheck on /health alone. The router's own .dockerignore note
    # records that a minimal context can drop bifrost_delegate.py, after which
    # the tool loop refuses EVERY delegated leaf, fail-closed, while /health
    # still returns 200. A /health healthcheck would read green on that failure.
    # The acceptance test must exercise one delegated leaf.

  # ===========================================================================
  # ARBITER.  Dockerfile ASSUMED (peer agent).
  # ===========================================================================
  arbiter:
    build:
      context: ../src/bifrost-router
      dockerfile: ../../docker/arbiter/Dockerfile
    image: bifrost-arbiter:dev
    env_file: *default-env
    environment:
      BIFROST_PATH_MODE: container
      # Do NOT remove INBOX_DIR. In production the inbox is a hostPath that works
      # only because the k3d node binds L:\net-ssd -> /net-ssd.
      INBOX_DIR: /inbox
    volumes:
      - ${BIFROST_VOL_NETSSD:?unset}/bifrost-inbox:/inbox:ro
      - ${BIFROST_VOL_NETSSD:?unset}/bifrost-tasks:/tasks:rw
      - ${BIFROST_VOL_NETSSD:?unset}/bifrost-board:/board:rw
    # 2026-10-05: default BOUND TO LOOPBACK on a non-colliding port. The previous
    # default published host 8082, which on Hearth is the board bridge that must
    # stay OFF -- it answers GET /board with full brief bodies and no credential.
    # Override ARBITER_PORT deliberately; do not reinstate a bare "8082".
    ports:
      - "${ARBITER_PORT:-127.0.0.1:18082}:8082"
    networks: [bifrost]
    logging: *default-logging
    restart: "no"

  # ===========================================================================
  # shell-MCP, static-analysis subset.  Dockerfile ASSUMED (peer agent).
  # The cleanest unit in the estate: no secret, no host path, no LAN literal.
  # ===========================================================================
  shell-mcp:
    build:
      context: ../src/bifrost-router
      dockerfile: ../../docker/shell-mcp/Dockerfile
    image: bifrost-shell-mcp:dev
    environment:
      BIFROST_PATH_MODE: container
    # 2026-10-05: NO `ports:` KEY, for the same reason execsvc has none -- the absent
    # host port IS the isolation. MEASURED 2026-10-05 against this image: a probe
    # sending no Authorization header, no token and no key had initialize,
    # tools/list and tools/call all return 200 and do the work. There is NO
    # authentication of any kind on 8086. The live v14/v15/v16 are protected by
    # `--transport stdio`, which opens no socket; this image uses `--transport http`
    # and so removes that protection with nothing in its place.
    # Other services reach it on the `bifrost` network without any host port.
    # 2026-10-13 (John, DECISIONS-john-60 row 44: "shell-mcp authentication first"):
    # AUTHENTICATED. bifrost_shell_static.py now requires `Authorization: Bearer
    # <token>` on every HTTP/WebSocket request and REFUSES TO START in http mode
    # without a token of >= 32 chars. The token is a FILE secret, never an env var
    # or build arg. The operator creates docker/secrets/shell_mcp_token at deploy
    # time (gitignored; no credential ships with RAMEAU). Measured on the
    # 2026-10-05 image with the new file mounted: no header / wrong token / token
    # without the Bearer prefix -> 401; right token -> 200 and EXACTLY run_checks,
    # run_mypy, run_ruff; missing or short token file -> exit 2.
    # Still NO `ports:` key: authentication is in addition to isolation, not instead.
    secrets: [shell_mcp_token]
    networks: [bifrost]
    logging: *default-logging
    restart: "no"
    # Acceptance is NOT "it starts". The tool list must contain EXACTLY
    # run_ruff / run_mypy / run_checks -- no host-coupled tool may be exposed.

  # ===========================================================================
  # skills-MCP.  Dockerfile PRE-EXISTING in bifrost-skills.
  # ===========================================================================
  # >>> THIS UNIT IS KNOWN BROKEN AND WILL LOOK HEALTHY. <<<
  #     Peer agent's defect D6 (_defect-fixes/README-DEFECTS.md), independently
  #     verified here against scripts/mcp_wrapper.py:
  #       D6a the CMD's --transport/--port/--host flags are SILENTLY IGNORED.
  #           mcp_wrapper.py has no argparse at all; its __main__ calls
  #           FastMCP().run(), which with no transport argument defaults to
  #           STDIO. So the container EXPOSEs 8095, this file publishes 8095,
  #           and the process listens on NO TCP PORT. It stays alive on stdin,
  #           so `docker ps` shows it Up and nothing reports a fault.
  #       D6b the three tool functions are decorated with a module-level
  #           `fastmcp.tools.tool` while the server object is constructed later
  #           inside __main__. Nothing binds them to that instance, so the
  #           server exposes ZERO TOOLS -- constructed but never registered.
  #           Fixing D6a alone yields an HTTP server with an empty tool list.
  #     Kept in this file, published port and all, because the dev loop is where
  #     that should be caught -- but the ONLY acceptance test that means anything
  #     is "the tool list is non-empty over HTTP on 8095". A container that is Up
  #     is not evidence. Do not mark this unit green on a `docker ps`.
  skills-mcp:
    build:
      context: ../src/bifrost-skills
      dockerfile: Dockerfile.bifrost-skills-mcp
    image: bifrost-skills-mcp:dev
    environment:
      BIFROST_PATH_MODE: container
      # D6c, 2026-10-16. The wrapper's peer is now a member of this project, so point
      # it at the service name. Without this line mcp_wrapper.py falls back to its own
      # default http://localhost:8094 -- which inside this container is this container,
      # and which returned "error: bifrost-skills not reachable" as a SUCCESSFUL tool
      # result on 2026-10-16. 8092 is serve.py's argparse default and is simply correct
      # on the project network; the 8092/8094 tally in D6c was a default compared with
      # the operator's `--port 8094` override on Bifrost, not two rival truths.
      BIFROST_SKILLS_URL: http://bifrost-skills:8092
    ports:
      - "${SKILLS_MCP_PORT:-127.0.0.1:18095}:8095"
    networks: [bifrost]
    logging: *default-logging
    restart: "no"
    # Ordering only -- `depends_on` without a condition waits for the peer to be
    # CREATED, not ready. That is all that is wanted: the wrapper opens no connection
    # at import, so a peer that is still booting costs one failed tool call, not a
    # crash. Nothing here should imply the peer is proven up; see its acceptance test.
    depends_on:
      - bifrost-skills

  # ===========================================================================
  # bifrost-skills.  Dockerfile AUTHORED 2026-10-16 at docker/bifrost-skills/,
  # which is the TENTH unit and the only one this project adds rather than stages.
  # It closes D6c: skills-mcp is a wrapper whose HTTP peer was never a member of
  # the project, so its two tools returned a graceful error string as a successful
  # result. The peer was never missing as SOURCE -- scripts/serve.py is a complete
  # 143-line FastAPI service serving exactly the /manifest and /skills/{name} the
  # wrapper calls. What was missing was packaging. Nothing in bifrost-skills is
  # modified by this; the whole change is a Dockerfile, this stanza and one env
  # line above.
  #
  # PORTS: container 8092 is serve.py's own argparse default and needs no override.
  # The host side publishes 18094, mirroring the live estate's 8094 the way KB's
  # 18091 and the broadcaster's 18092 mirror theirs -- the host digit tracks the
  # LIVE port, the container port is whatever the app binds. They differ here for
  # the same reason they differ there.
  #
  # ACCEPTANCE -- content, not liveness, and not `docker ps`:
  #   `call_tool('list_skills')` over the MCP wrapper on 18095 returns exactly
  #   ['mcp-builder', 'n8n-workflow-conventions', 'skill-creator'].
  # That asserts the whole chain at once: the image has the corpus, serve.py's
  # REPO_ROOT resolved, the project network resolves the service name, and the
  # wrapper reaches it. A count of 0 means the COPY layout broke REPO_ROOT and the
  # service is serving an empty corpus while answering 200 -- which is the exact
  # silent-success D6 exists to catch. NO healthcheck, for the reason given at
  # lines 212-215 and 405: /health answering 200 is not evidence of content.
  # ===========================================================================
  bifrost-skills:
    build:
      context: ../src/bifrost-skills
      dockerfile: ../../docker/bifrost-skills/Dockerfile
    image: bifrost-skills:dev
    # NO environment: block. The unit takes no configuration -- it reads the corpus
    # baked beside it and binds the host/port in its CMD. No secret, no upstream, no
    # host coupling, so there is nothing to inject and nothing to leak.
    ports:
      - "${SKILLS_PORT:-127.0.0.1:18094}:8092"
    networks: [bifrost]
    logging: *default-logging
    restart: "no"

  # ===========================================================================
  # KB.  Dockerfile PRE-EXISTING at bifrost-platform/bifrost-kb/Dockerfile.
  # This CLOSES an assessment gap: the KB Dockerfile was recorded as living
  # outside RAMEAU at D:\Projects\bifrost-kb and therefore unavailable. It is in
  # bifrost-platform, with its 111-pin frozen lock and patch_chroma.py beside it.
  # Its own header warns it is RECONSTRUCTED from the running 1.18 image and is
  # UNVERIFIED until a rebuild proves /app matches. Treat accordingly.
  # ===========================================================================
  bifrost-kb:
    build:
      context: ../src/bifrost-platform/bifrost-kb
      dockerfile: Dockerfile
    image: bifrost-kb:1.24-rc
    env_file: *default-env
    environment:
      BIFROST_PATH_MODE: container
      # Do NOT bake the IPs. Unset must fail loudly, not default to a literal.
      EMBED_API_BASE: ${EMBED_API_BASE:?set the embedding endpoint; do not bake an IP}
      CHAT_API_BASE: ${CHAT_API_BASE:?set the chat endpoint; do not bake an IP}
    volumes:
      - ${BIFROST_VOL_DOCS:?unset}/inhouse/chroma:/data/chroma:rw
      - ${BIFROST_VOL_DOCKERDATA:?unset}/bifrost-kb/inbox:/data/inbox:rw
    ports:
      - "${KB_PORT:-127.0.0.1:18091}:8090"
    networks: [bifrost]
    logging: *default-logging
    restart: "no"
    # TRAPS, from the assessment and from standing fleet knowledge:
    #  * the pin set needs a CPU torch wheel from a non-default index; the
    #    Dockerfile already passes --extra-index-url .../whl/cpu. A plain
    #    `pip install -r` pulls CUDA and the image becomes multi-GB.
    #  * the embed service on :11436 must NEVER be benchmarked here. Liveness
    #    only.
    #  * `similarity` in this service's output is PRE-RERANK. Do not assert on
    #    it as a final score.

  # ===========================================================================
  # BROADCASTER.  Dockerfile PRE-EXISTING.
  # NOTE a real discrepancy: the Dockerfile EXPOSEs 8090 and the live Service is
  # port 8090 -> targetPort 8090, but the router's own ConfigMap draft in
  # bifrost-router.yaml says BROADCASTER_URL "http://broadcaster:8092". 8090 is
  # what the manifest and the Dockerfile agree on; 8092 appears only in that
  # commented ConfigMap. Using 8090 and recording the conflict.
  # ===========================================================================
  broadcaster:
    build:
      context: ../src/bifrost-platform/control-plane/broadcaster
      dockerfile: ../../../../docker/broadcaster/Dockerfile
    image: bifrost-broadcaster:dev
    environment:
      BIFROST_PATH_MODE: container
      OBSERVER_URL: http://observer:8081
      BROADCASTER_POLL_INTERVAL: ${BROADCASTER_POLL_INTERVAL:-30}
      BROADCASTER_PROBE_TIMEOUT: ${BROADCASTER_PROBE_TIMEOUT:-5}
    ports:
      - "${BROADCASTER_PORT:-127.0.0.1:18092}:8090"
    networks: [bifrost]
    logging: *default-logging
    restart: "no"
    # Flux-managed with prune: true. Do NOT commit a manifest edit from the dev
    # loop; produce the image, let P14 wire it.

  # ===========================================================================
  # OBSERVER.  Dockerfile PRE-EXISTING at bifrost-platform/docker/observer/,
  # WITH a requirements.txt -- which closes another assessment gap ("Observer has
  # no requirements.txt"). It does, in bifrost-platform.
  # ===========================================================================
  observer:
    build:
      context: ../src/bifrost-platform/docker/observer
      dockerfile: ../../../../docker/observer/Dockerfile
    image: bifrost-observer:dev
    environment:
      BIFROST_PATH_MODE: container
      OBSERVER_POLL_INTERVAL: ${OBSERVER_POLL_INTERVAL:-30}
      OBSERVER_PROBE_TIMEOUT: ${OBSERVER_PROBE_TIMEOUT:-5}
      # The live observer-config.yaml points these at LAN hosts. They are the
      # host boundary (P15): every one must be a configured URL, never a literal.
      BIFROST_GPU_URL: ${BIFROST_GPU_URL:?host boundary - set explicitly}
      BIFROST_CPU_URL: ${BIFROST_CPU_URL:?host boundary - set explicitly}
      FORGE_OLLAMA_URL: ${FORGE_OLLAMA_URL:?host boundary - set explicitly}
      HEARTH_EMBED_URL: ${HEARTH_EMBED_URL:?host boundary - set explicitly}
    ports:
      - "${OBSERVER_PORT:-127.0.0.1:18081}:8081"
    networks: [bifrost]
    logging: *default-logging
    restart: "no"
    # A sick ollama returns 200 on four distinct faults, so the observer's own
    # probe result -- not an HTTP 200 -- is the health signal. Do not add a
    # healthcheck that asserts on status code alone.

  # ===========================================================================
  # execsvc (L5/L6 sandbox).  Dockerfile PRE-EXISTING at
  # bifrost-platform/execsvc/ WITH its offline vendor/ wheel set (6 wheels:
  # pytest 9.1.1 + colorama, iniconfig, packaging, pluggy, pygments).
  #
  # THIS CLOSES THE ASSESSMENT'S HIGHEST-RISK GAP. The assessment recorded
  # execsvc as having "NO recipe and NO source for the image" and called P11
  # "image archaeology ... highest risk in the plan". The recipe exists, in the
  # Flux source repo, in two copies -- and it is a documented reconstruction from
  # `docker history` of the live v5, already done on 2026-07-31/2026-08-12.
  # P11 is therefore a VERIFICATION packet, not an archaeology packet.
  #
  # Build it with NO NETWORK: the offline-install promise is the whole point.
  #   docker compose -f docker-compose.build.yml build execsvc
  #   docker build --network none -f Dockerfile ../bifrost-platform/execsvc
  # ===========================================================================
  execsvc:
    build:
      context: ../src/bifrost-platform/execsvc
      dockerfile: Dockerfile
    image: bifrost-aio-sandbox:v6-rc
    environment:
      BIFROST_PATH_MODE: container
    # NO `ports:` KEY. THE ABSENT HOST PORT IS THE ISOLATION.
    # Three reasons never to add one:
    #   1. the live container publishes nothing, by design;
    #   2. host port 8000 on Hearth is PAPERLESS-NGX. Exposing execsvc there,
    #      or pointing the k8s EndpointSlice at the docker gateway, routes
    #      generated code into the document manager;
    #   3. the production containment is NetworkPolicy, and `internal: true`
    #      below is a weaker approximation, not an equivalent (see fact (1)).
    networks: [sandbox]
    logging: *default-logging
    restart: "no"
    # DO NOT bring up bifrost-platform/control-plane/execsvc/docker-compose.yml
    # instead of this service: its own header warns that doing so RECREATES THE
    # LIVE CONTAINER. Also: the live static IP 172.31.240.240 must stay in  # rameau-scan: allow -- a Docker bridge subnet declaration, not a deployment address
    # lockstep with sandbox/endpointslice execsvc-manual .endpoints[0]
    # .addresses[0]; changing one alone reproduced a 4-DAY SILENT L5 OUTAGE on
    # 2026-08-11. This dev-loop service deliberately takes NO static IP, so it
    # cannot drift that pair.

  # ===========================================================================
  # PORTAL.  Dockerfile NEWLY AUTHORED by the peer agent at _build/portal/, with
  # its own nginx.conf staged beside it. Multi-stage node:20-alpine build ->
  # nginx:alpine serve, and it BAKES both dist/ and the conf -- so the two
  # drive-letter binds the live service depends on (L:/bifrost-portal and
  # L:/bifrost-portal-conf) are RETIRED, not re-expressed. That is why this
  # service has no `volumes:` key, and it must stay that way.
  #
  # Two assessment UNVERIFIEDs are closed by the capture:
  #   * WHICH SOURCE IS CURRENT: bifrost-router/CLAUDE.md:34 and
  #     OPERATING-RULES.md:23 name
  #       <repo-root>\bifrost-platform\bifrost-portal
  #     as "THE buildable one -- it built the live bundle", and record
  #     L:\bifrost-portal-src as RETIRED 2026-08-17 ("Do not build from it",
  #     renamed to ...DISABLED-2026-08-17). The 14 .bak-* siblings need no
  #     adjudicating: the tree moved repos.
  #   * THE NGINX CONF: recorded as "not in the tree" and needing capture from
  #     the host. It is in the tree, at bifrost-platform/bifrost-portal/
  #     nginx.conf, 136 lines, carrying the portal-fix-v1-h2 reverse-proxy
  #     locations for /router /kb /broadcaster /arbiter and the immutable-asset
  #     cache headers.
  # ===========================================================================
  portal:
    build:
      context: ../src/bifrost-platform/bifrost-portal
      dockerfile: ../../../docker/portal/Dockerfile
    image: bifrost-portal:dev
    environment:
      # D8 (2026-10-15). nginx.conf proxies three routes to the Bifrost host through
      # ${BIFROST_HOST}, which the nginx image's envsubst resolves at container start
      # (see docker/portal/Dockerfile, which also sets NGINX_ENVSUBST_FILTER so only
      # BIFROST_-prefixed names are touched). Without this line the variable is never
      # in the container env, envsubst leaves it verbatim, and nginx dies with
      # 'unknown "bifrost_host" variable'. Measured -- that is not hypothetical.
      # The default matches the five sibling proxy_pass lines that 8c0e12f never
      # genericised, so a plain 'docker compose up' works with no .env at all.
      # D13 (2026-10-16). This default was `host.docker.internal`, which is the
      # DOCKER HOST -- so the three Bifrost-side routes in nginx.conf silently
      # served Hearth. Measured: /retriever/system/status and
      # /broadcaster/system/status returned byte-identical live broadcaster
      # payloads at HTTP 200. A wrong answer, not an error.
      #
      # `bifrost.invalid` is an RFC 2606 reserved name and can never resolve.
      # That is the point: those three routes are resolved at REQUEST time now
      # (see the D13 block in nginx.conf), so an unconfigured stack boots
      # normally, serves every other route, and returns a loud 502 on exactly
      # the three that are unconfigured -- instead of a plausible wrong answer.
      # This does NOT reintroduce the D8 boot failure, which came from nginx
      # resolving a LITERAL proxy_pass host at startup.
      #
      # Set BIFROST_HOST to the Bifrost machine to make those three work.
      BIFROST_HOST: ${BIFROST_HOST:-bifrost.invalid}
    ports:
      - "${PORTAL_PORT:-127.0.0.1:13110}:80"
    networks: [bifrost]
    logging: *default-logging
    restart: "no"
    deploy:
      resources:
        limits:
          # the cap the live bifrost-portal container runs under
          memory: 64M
          cpus: "0.1"
    # NO volumes. Acceptance: `curl /` returns the BUILT index.html whose asset
    # hash matches the one baked in the image, with no bind mount anywhere, and
    # memory stays under the 64M the live service is capped at.

  # ===========================================================================
secrets:
  # Operator-created at deploy time, NEVER committed (docker/secrets/ is gitignored).
  # Generate on the host that runs the stack, e.g.
  #   python -c "import secrets; print(secrets.token_hex(32))" > docker/secrets/shell_mcp_token
  shell_mcp_token:
    file: ./secrets/shell_mcp_token

networks:
  bifrost:
    driver: bridge

  sandbox:
    # `internal: true` denies egress to networks outside this one. It is the
    # CLOSEST Compose can come to the production deny-all + DNS-only-egress
    # NetworkPolicy pair, and it is NOT equivalent -- see fact (1) at the top.
    # It is here so a dev-loop execsvc is not wide open, not because it
    # reproduces the containment.
    driver: bridge
    internal: true
