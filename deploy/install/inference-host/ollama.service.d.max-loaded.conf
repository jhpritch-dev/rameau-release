# Reference copy of Forge's /etc/systemd/system/ollama.service.d/max-loaded.conf
#
# BRIEF 1 RESEARCH-FANOUT FEASIBILITY (2026-05-23) added this drop-in to bump
# OLLAMA_MAX_LOADED_MODELS from the default 3 (1 GPU * 3) to 4 so the 4-wide
# cross-family panel can stay co-resident. VRAM is not the constraint at N=4
# (combined 79.7 GiB / 96 GiB UMA, 16.3 GiB headroom); the Ollama default
# concurrency cap is.
#
# To restore on a reinstalled Forge:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp ollama.service.d.max-loaded.conf /etc/systemd/system/ollama.service.d/max-loaded.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama

[Service]
Environment=OLLAMA_MAX_LOADED_MODELS=4
