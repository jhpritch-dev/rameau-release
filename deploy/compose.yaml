# RAMEAU -- Docker Compose stack for v0.1
#
# Scope: this file runs the two units v0.1 publishes -- the router and the portal -- on one
# host, with no cluster and no registry. RELEASE-SCOPE.md puts "Docker Compose, including a
# profile that runs with no egress" in scope for v0.1; the no-egress half is
# compose.no-egress.yaml beside this file, applied as an overlay.
#
# -----------------------------------------------------------------------------------------
# WHY THERE IS NO `ollama` SERVICE, AND WHY THAT IS NOT AN OMISSION
# -----------------------------------------------------------------------------------------
# Inference stays on the host. A container that wanted the accelerator would need /dev/kfd,
# /dev/dri or /dev/accel passed into it, which ties the stack to one vendor's driver stack on
# one kind of host -- and RAMEAU is published to run on hosts whose accelerators we know
# nothing about. So the generation and embedding backends are HOST-BOUNDARY INPUTS: you point
# RAMEAU_OLLAMA_URL at an ollama you already run, and the stack never owns a model, a driver
# or a GPU. This also keeps the no-egress profile meaningful: the router still reaches a local
# backend across the host gateway with no route off the machine.
#
# The same reasoning makes arbiter, kb, broadcaster and search absent rather than optional
# services: none of their images is part of v0.1, so defining them here would describe a
# stack this repository cannot build. They are URLs if you have them and blank if you do not
# -- see "OPTIONAL ENDPOINTS" below.
#
# -----------------------------------------------------------------------------------------
# EVERY PUBLISHED PORT BINDS 127.0.0.1
# -----------------------------------------------------------------------------------------
# Each `ports:` entry below has an explicit 127.0.0.1 in its default. A bare "18080:8080"
# binds 0.0.0.0 and publishes the router to the whole network the host sits on, which for a
# router that will happily proxy to a local model is not a small mistake. If you need to
# expose a port deliberately, override the variable -- so that the exposure is a decision
# someone wrote down, not a default nobody read.
#
# Requires Compose v2.24 or newer, for `env_file: required: false`.

name: rameau

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# The operator's own values. Copy profiles/compose.env.example to profiles/compose.env and
# edit it; `required: false` means the stack still starts without it, so that a first run
# fails on a missing endpoint with the registry's own error message rather than on a missing
# file. The example is generated from shared/resolver.py -- edit the registry, not the file.
x-env-file: &env-file
  - path: profiles/compose.env
    required: false

services:

  # =========================================================================================
  # ROUTER -- the OpenAI-compatible endpoint, classifier, cascade and request cache
  # =========================================================================================
  router:
    build:
      context: ../services/router
      dockerfile: ../../deploy/images/router/Dockerfile
      args:
        # A build arg is never a secret: it is baked into the image and readable with
        # `docker history`. A commit SHA is fine; a token would not be.
        RAMEAU_COMMIT: ${RAMEAU_COMMIT:-unknown}
    image: rameau/router:${RAMEAU_TAG:-dev}
    env_file: *env-file
    environment:
      # --- host-boundary inputs: REQUIRED, and deliberately un-defaulted --------------------
      # `:?` fails the run with this message rather than starting a router that cannot
      # generate. There is no default because every plausible default is wrong: a loopback
      # address means "this container", not "the host", and a guess that resolves is worse
      # than one that does not.
      # NOTE WHERE THIS ONE GOES, because it is NOT where the five below go. `:?` is
      # resolved at INTERPOLATION time, before any env_file is read, so setting it in
      # profiles/compose.env is not enough -- measured: compose still refuses. It has to
      # be in the shell or in deploy/.env. The message says so, because the operator who
      # hits it has just copied compose.env.example, which contains this key.
      RAMEAU_OLLAMA_URL: ${RAMEAU_OLLAMA_URL:?set this in deploy/.env or your shell -- NOT in profiles/compose.env, which is read too late for this one -- e.g. RAMEAU_OLLAMA_URL=http://host.docker.internal:11434. A container loopback address reaches the container, not the host}
      # --- THE FIVE OPTIONAL ENDPOINTS ARE DELIBERATELY ABSENT FROM THIS BLOCK -------------
      # RAMEAU_EMBED_URL, RAMEAU_ARBITER_URL, RAMEAU_KB_URL, RAMEAU_BROADCASTER_URL and
      # RAMEAU_SEARCH_URL come from `env_file` above -- profiles/compose.env -- and are not
      # named here. Declaring them here is what stopped that file from working, and the
      # three available forms were measured with `docker compose config` on 2026-11-02
      # (Compose v5.6.1), against an env_file that set each one:
      #
      #   `VAR: ${VAR:-}`   shell unset -> ""      <- the empty string OVERRIDES the file
      #   `- VAR`           shell unset -> null    <- unset, and still overrides the file
      #   absent            shell unset -> the file's value reaches the service
      #
      # `environment:` outranks `env_file:`, so the first two forms silently replace whatever
      # the operator wrote with empty or nothing, and the resolver -- for which "empty means
      # unset" -- then reports the endpoint as not configured. deploy/README.md step 1 told
      # operators to create a file that could not reach the service it was for.
      #
      # The cost of the fix, stated rather than buried: for these five, the shell and
      # deploy/.env no longer reach the router -- profiles/compose.env is now the only
      # surface, which is what step 1 always said it was. There is no form that takes the
      # file as a fallback UNDER a shell override; one source has to win, and the operator's
      # own file is the one this stack documents.
      # --- the router's own identity, as other services should address it --------------------
      # 8080 is the port the container listens on (see the Dockerfile's CMD). It is NOT the
      # port the private deployment published, and this is the one place that distinction has
      # bitten: an in-container URL built from a host-side port resolves to nothing.
      RAMEAU_ROUTER_URL: http://router:8080
      RAMEAU_ROUTER_CHAT_URL: http://router:8080/v1/chat/completions
      # /health, not /status: /status answers "online" unconditionally. See the
      # router_health entry in shared/resolver.py, and note that /health's verdict is in
      # its BODY -- it returns 200 whether the backends are up or down, which is why this
      # stack defines no healthcheck.
      RAMEAU_ROUTER_HEALTH_URL: http://router:8080/health
    volumes:
      # The four runtime JSON files are read as `Path(__file__).parent / "<name>.json"`, so
      # each must land at /app/<name>.json EXACTLY. Mounting a directory onto /app instead
      # would shadow the application code with a config folder, and the container would start
      # and then fail to import -- so these are four file mounts, not one directory mount.
      #
      # The release ships them as *.example.json, because the real ones carry fleet detail;
      # copy and edit them once (deploy/README.md). Read-only, so the container cannot drift
      # from what you edited. fleet_config.json additionally re-reads on mtime change on every
      # request, so editing the host file re-tiers a running router with no restart.
      - ./config/fleet_config.json:/app/fleet_config.json:ro
      - ./config/capability_registry.json:/app/capability_registry.json:ro
      - ./config/capability_profiles.json:/app/capability_profiles.json:ro
      - ./config/bifrost_shell_policy.json:/app/bifrost_shell_policy.json:ro
    ports:
      - "${RAMEAU_ROUTER_PUBLISH:-127.0.0.1:18080}:8080"
    extra_hosts:
      # host.docker.internal is a Docker Desktop name and does NOT resolve inside a container
      # on a Linux host without this. Without it the router starts, /status answers, and every
      # generation request fails -- the failure looks like a model problem and is not.
      - "host.docker.internal:host-gateway"
    networks: [rameau]
    logging: *logging
    restart: "no"
    # NO healthcheck on /health alone, deliberately. The router's own
    # Dockerfile.dockerignore records that a minimal build context can drop
    # bifrost_delegate.py -- which is read off disk with `ast` and imported by nothing, so an
    # import-closure context misses it -- after which the tool loop refuses every delegated
    # leaf, fail-closed, while /health still returns 200. A healthcheck on /health would read
    # green on exactly that failure and is therefore worse than none. The acceptance test
    # must exercise one delegated leaf; see deploy/README.md.
    #
    # SUSPENDED 2026-11-02: the ruled router source contains no delegate and no tool loop,
    # so there is no leaf to exercise. The reasoning above is kept because it is sound and
    # describes a different artefact, and the no-healthcheck decision stands on its own
    # second reason -- /health answers 200 whether the backends are up or down, so a
    # healthcheck on it reads green while generation fails. See RELEASE-SCOPE.md.

  # =========================================================================================
  # PORTAL -- the existing web UI, ruled in scope by John on 2026-10-27
  # =========================================================================================
  portal:
    build:
      context: ../services/portal
      dockerfile: ../../deploy/images/portal/Dockerfile
    image: rameau/portal:${RAMEAU_TAG:-dev}
    env_file: *env-file
    environment:
      # The portal's nginx config is copied into the image as a TEMPLATE, and the nginx
      # image's own 20-envsubst-on-templates.sh resolves ${BIFROST_HOST} at container start.
      # The envsubst FILTER in the Dockerfile is not optional -- the config carries 25 nginx
      # runtime variables ($host, $uri, $remote_addr ...) and an unfiltered substitution
      # blanks every one of them, producing a config that starts and proxies wrongly, which
      # is worse than a config that refuses to start.
      BIFROST_HOST: ${BIFROST_HOST:-host.docker.internal}
    ports:
      - "${RAMEAU_PORTAL_PUBLISH:-127.0.0.1:13110}:80"
    extra_hosts:
      # The portal's nginx proxies five routes to host.docker.internal (/router/, /kb/,
      # /broadcaster/, /arbiter/, /prom/). Without this the portal does NOT come up on Linux:
      # nginx resolves a literal upstream name when it parses its config, so an unresolvable
      # one is fatal -- `[emerg] host not found in upstream`, and the container crash-loops.
      # This comment said "they 502 while / still serves the SPA" until 2026-11-02; that is
      # what a resolver-plus-variable upstream does, not a literal one. See RELEASE-SCOPE.md:
      # nginx.conf is not in this repository and its variant is not yet settled.
      - "host.docker.internal:host-gateway"
    depends_on:
      # Ordering only. Compose's plain depends_on waits for the container to start, not for
      # the app to be ready, and there is no router healthcheck to wait on (see above). The
      # portal tolerates a router that is not up yet: those routes 502 until it is.
      - router
    networks: [rameau]
    logging: *logging
    restart: "no"

networks:
  rameau:
    driver: bridge
