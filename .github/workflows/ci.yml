name: ci

# This gate exists BEFORE the source tree lands, deliberately. The secret scan is the third
# of three layers that keep credentials out of this repository (allowlist, .gitignore, this),
# and it is the only one that runs on every push whether or not a human remembered the other
# two. The build steps below are written to pass on an empty tree and to start doing real
# work the moment source appears, so the gate never has to be "turned on" later.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a scan of the working tree alone cannot see a value that was
          # committed and later removed, and a removed value is still reachable.
          fetch-depth: 0

      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: prove the scanner fires before trusting a zero
        # A clean report is exactly the output nobody re-checks. So plant a known-positive
        # in a scratch directory OUTSIDE the repo, confirm gitleaks reports it, and only
        # then believe a zero from the real scan. A scan that cannot be shown to fire is
        # not evidence.
        run: |
          set -euo pipefail
          mkdir -p /tmp/canary && cd /tmp/canary
          git init -q .

          # The canary is GENERATED, for two separate reasons.
          #
          # 1. A literal key written here would itself be a finding in THIS file, and the
          #    scan step below scans the workspace -- so the gate would fail on its own
          #    workflow. Allowlisting this path instead would weaken the only layer that
          #    runs unconditionally.
          #
          # 2. The first version of this step used AWS's documented example key. gitleaks
          #    ALLOWLISTS that value by default, precisely because it appears in
          #    documentation everywhere -- so the control failed on its first run and
          #    correctly refused to let the real scan be trusted. A canary has to be a
          #    value the scanner will actually flag, not a famous example every scanner is
          #    built to ignore. base32 emits A-Z2-7, which satisfies the AWS key shape, and
          #    `cut` rather than a second `head` avoids a SIGPIPE under `pipefail`.
          KEY="AKIA$(LC_ALL=C head -c 64 /dev/urandom | base32 | tr -d '=' | tr -cd 'A-Z0-9' | cut -c1-16)"
          printf 'aws_access_key_id = %s\n' "$KEY" > creds.txt
          git add creds.txt
          git -c user.email=ci@example.invalid -c user.name=ci commit -qm canary

          # gitleaks exits nonzero when it finds something, so a ZERO exit here means the
          # planted credential was missed.
          if gitleaks detect --source . --no-banner --redact --exit-code 1 >/dev/null 2>&1; then
            echo "CONTROL FAILED: gitleaks did not flag a generated known-positive."
            echo "The scan below cannot be trusted and this job fails on purpose."
            exit 1
          fi
          echo "control ok: gitleaks flags a generated known-positive"

      - name: scan working tree and full history
        # --redact so a finding never prints the value into a public CI log.
        run: |
          set -euo pipefail
          gitleaks detect \
            --source "$GITHUB_WORKSPACE" \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1

      - name: upload findings
        if: always()
        # v7, not v4: v4 is a Node 20 action. That was NOT visible until
        # actions/checkout was moved off Node 20 in this same change -- the runner's
        # deprecation warning named only checkout while both were on 20, and named
        # upload-artifact on the next run once checkout no longer was. So "the warning did
        # not mention it" was not evidence of anything, and this line is here because the
        # second run said so.
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  build:
    name: compile and validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: byte-compile python, if any
        run: |
          set -euo pipefail
          # -print -quit avoids walking the whole tree just to answer "are there any".
          if [ -z "$(find . -name '*.py' -not -path './.git/*' -print -quit)" ]; then
            echo "no python in the tree yet - skipping (this is expected pre-source)"
            exit 0
          fi
          python -m compileall -q .
          echo "byte-compile ok"

      - name: run tests, if any
        # The byte-compile above proves the tree parses, which is not the same as the
        # code being correct. The resolver's whole value is a behaviour -- that an unset
        # endpoint RAISES instead of defaulting to an unreachable literal -- and a
        # behaviour is only guarded by running it.
        run: |
          set -euo pipefail
          if [ -z "$(find . -name 'test_*.py' -not -path './.git/*' -print -quit)" ]; then
            echo "no tests yet - skipping (this is expected pre-source)"
            exit 0
          fi
          python -m pip install --quiet --disable-pip-version-check pytest
          python -m pytest -q --tb=line
          echo "tests ok"

      - name: the example env files must be GENERATED, not written
        # Both files claim to come from the registry in shared/resolver.py. A claim in a
        # header comment is not a property; regenerating and diffing is. Without this,
        # someone edits .env.example by hand, the header still says "generated", and the
        # next regeneration silently reverts their change.
        run: |
          set -euo pipefail
          if [ ! -f shared/resolver.py ]; then
            echo "no resolver yet - skipping (this is expected pre-source)"
            exit 0
          fi
          python shared/resolver.py --env-example > /tmp/env.expected
          python shared/resolver.py --compose-example > /tmp/compose.expected
          fail=0
          diff -u .env.example /tmp/env.expected || fail=1
          diff -u deploy/profiles/compose.env.example /tmp/compose.expected || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "an example env file is out of step with the registry."
            echo "regenerate it rather than editing it by hand:"
            echo "  python shared/resolver.py --write-examples"
            echo "(which writes both files as bytes. The '>' redirect used by this step"
            echo " is fine on Linux, but on Windows python's text-mode stdout emits CRLF"
            echo " and would fail this same diff for a reason unrelated to the registry.)"
            exit 1
          fi
          echo "both example env files match the registry"

      - name: the in-network profile must not contain loopback
        # The failure this guards is silent: loopback inside a container resolves to the
        # container itself, so the stack comes up and every endpoint refuses.
        run: |
          set -euo pipefail
          f=deploy/profiles/compose.env.example
          [ -f "$f" ] || { echo "no compose profile yet - skipping"; exit 0; }
          if grep -nE '127\.0\.0\.1|localhost' "$f"; then
            echo "loopback in the in-network profile: inside a container that is the"
            echo "container itself, not the service."
            exit 1
          fi
          echo "no loopback in the in-network profile"

      - name: validate compose
        # This step globbed FOUR ROOT-RELATIVE names until 2026-10-27, and both stacks
        # live in deploy/. So it matched nothing, took the `found -eq 0` branch, and
        # printed "no compose file yet - skipping (this is expected pre-source)" -- a
        # green that actively reassures. Anyone reading that log concludes the stack is
        # unwritten rather than unvalidated, which is worse than a silent pass: a syntax
        # error in deploy/compose.yaml shipped green.
        #
        # Validate by PATH, and fail when a named file is absent. A compose gate that
        # cannot find its own compose file has nothing to say about the stack, so it must
        # not be the thing that reports success.
        env:
          # RAMEAU_OLLAMA_URL is deliberately REQUIRED with no default -- every plausible
          # default is wrong, and a guess that resolves is worse than one that does not.
          # That means `config` cannot interpolate the file without a value, so the parse
          # needs one. `.invalid` is reserved by RFC 2606 and can never resolve, so this
          # placeholder cannot accidentally become a working address.
          RAMEAU_OLLAMA_URL: http://ollama.invalid:11434
        run: |
          set -euo pipefail
          for f in deploy/compose.yaml deploy/compose.no-egress.yaml; do
            test -f "$f" || { echo "expected $f and it is not there"; exit 1; }
          done

          # Control first, and it is not ceremony: it asserts the required-variable
          # design still holds. If the stack ever parses with RAMEAU_OLLAMA_URL unset,
          # something has given it a default, and a deployment would then come up
          # pointing at whatever that default is instead of refusing.
          if env -u RAMEAU_OLLAMA_URL docker compose -f deploy/compose.yaml config \
               --quiet >/dev/null 2>&1; then
            echo "the stack parsed with RAMEAU_OLLAMA_URL unset: something now supplies"
            echo "a default for it, which is the opposite of the intended behaviour."
            exit 1
          fi
          echo "control ok: the stack refuses to resolve without RAMEAU_OLLAMA_URL"

          echo "validating deploy/compose.yaml"
          docker compose -f deploy/compose.yaml config --quiet

          # The overlay is not a stack on its own -- it is a single `networks:` key with
          # no services -- so it is only meaningful validated TOGETHER with the base.
          echo "validating deploy/compose.yaml + deploy/compose.no-egress.yaml"
          docker compose -f deploy/compose.yaml -f deploy/compose.no-egress.yaml \
            config --quiet
          echo "compose ok"

      - name: profiles/compose.env must actually reach the router
        # The regression this guards shipped once, and it was invisible: compose.yaml gave the
        # router `env_file: profiles/compose.env` AND re-declared five optional endpoints in
        # `environment:` as ${VAR:-}. `environment:` outranks `env_file:`, so with nothing in
        # the interpolation environment all five arrived as the EMPTY STRING and overrode the
        # operator's file -- and because the resolver treats empty as unset, the router then
        # reported them as not configured. deploy/README.md step 1 was telling operators to
        # create a file that could not reach the service it was for.
        #
        # Nothing failed. The stack came up, `config` parsed, and the endpoints were simply
        # not there. So this asserts the property directly: write a sentinel into the file and
        # require it to survive into the router's resolved environment.
        env:
          RAMEAU_OLLAMA_URL: http://ollama.invalid:11434
        run: |
          set -euo pipefail
          f=deploy/profiles/compose.env
          [ -e "$f" ] && { echo "$f already exists; refusing to overwrite it"; exit 1; }
          trap 'rm -f "$f"' EXIT

          # Documentation-range names only, and a sentinel that cannot occur by accident.
          cat > "$f" <<'ENVFILE'
          RAMEAU_EMBED_URL=http://embed.example.com:11434
          RAMEAU_ARBITER_URL=http://arbiter.example.com:8082
          RAMEAU_KB_URL=http://kb-reaches-the-router.example.com:8090
          RAMEAU_BROADCASTER_URL=http://broadcaster.example.com:8090
          RAMEAU_SEARCH_URL=http://search.example.com:8080
          ENVFILE
          sed -i 's/^ *//' "$f"

          cfg=$(docker compose -f deploy/compose.yaml config --format json)

          got=$(printf '%s' "$cfg" | jq -r '.services.router.environment.RAMEAU_KB_URL // "<<absent>>"')
          if [ "$got" != "http://kb-reaches-the-router.example.com:8090" ]; then
            echo "profiles/compose.env does NOT reach the router."
            echo "  RAMEAU_KB_URL resolved to: $got"
            echo "Almost certainly an endpoint was re-declared under the router's"
            echo "\`environment:\` key, which outranks \`env_file:\`. See the comment block in"
            echo "deploy/compose.yaml: the three forms are measured there, and only OMITTING"
            echo "the variable lets the file through."
            exit 1
          fi
          echo "ok: the operator's file reaches the router (RAMEAU_KB_URL = $got)"

          # The same defect, caught from the other side: no RAMEAU_* endpoint may resolve to
          # the empty string or to null while the file sets it.
          blank=$(printf '%s' "$cfg" | jq -r '
            .services.router.environment | to_entries
            | map(select(.key | startswith("RAMEAU_")))
            | map(select(.value == "" or .value == null) | .key) | join(",")')
          if [ -n "$blank" ]; then
            echo "these router variables resolved to empty/null despite the file setting them: $blank"
            exit 1
          fi
          echo "ok: no router endpoint is clobbered to empty"

          # Control: the three router URLs are hardcoded in compose.yaml ON PURPOSE and MUST
          # keep overriding the file, because the file addresses the router by service name on
          # a port that a host-side example may have carried over. shared/test_resolver.py
          # asserts those three values against compose.yaml.
          for pair in "RAMEAU_ROUTER_URL=http://router:8080" \
                      "RAMEAU_ROUTER_HEALTH_URL=http://router:8080/health"; do
            k=${pair%%=*}; want=${pair#*=}
            have=$(printf '%s' "$cfg" | jq -r --arg k "$k" '.services.router.environment[$k] // "<<absent>>"')
            [ "$have" = "$want" ] || {
              echo "$k is $have, expected $want -- compose.yaml must keep winning for these"
              exit 1
            }
          done
          echo "ok: the router's own three URLs still come from compose.yaml"

      - name: licence and scope invariants
        # Cheap structural checks that protect the two promises this repo makes about itself.
        run: |
          set -euo pipefail
          test -f LICENSE || { echo "LICENSE missing"; exit 1; }
          grep -q "Apache License" LICENSE || { echo "LICENSE is not Apache-2.0"; exit 1; }
          test -f RELEASE-SCOPE.md || { echo "RELEASE-SCOPE.md missing"; exit 1; }
          test -f SECURITY.md || { echo "SECURITY.md missing"; exit 1; }
          echo "invariants ok"

  images:
    name: build images
    runs-on: ubuntu-24.04
    # Separate from `build` on purpose. That job is seconds of python and a compose parse; this
    # one pulls base layers and runs a pip install and an npm ci. Pinning them together would
    # mean a slow image build gating a fast syntax answer, and the two fail for unrelated
    # reasons.
    steps:
      - uses: actions/checkout@v7

      - name: the stack's own files must be here before "skipped" can mean anything
        # This step exists because of the defect recorded in `validate compose` above: that
        # step globbed four root-relative names, matched nothing, and printed "no compose file
        # yet - skipping" -- a green that actively reassured while a syntax error shipped.
        #
        # The same trap is available here and is worse, because the skip condition below is a
        # MISSING DIRECTORY, which is also exactly what a bad checkout, a renamed deploy/ or a
        # sparse clone looks like. So assert the artefacts that CANNOT be absent first. If one
        # of them is gone, the contexts being absent is no longer evidence of anything and
        # this job must not be the thing reporting success.
        run: |
          set -euo pipefail
          for f in deploy/compose.yaml \
                   deploy/images/router/Dockerfile \
                   deploy/images/portal/Dockerfile; do
            test -f "$f" || {
              echo "expected $f and it is not there."
              echo "This job's skip condition is a missing services/ directory, which is"
              echo "indistinguishable from a broken checkout unless the stack's own files"
              echo "are known to be present. They are not, so nothing here is trustworthy."
              exit 1
            }
          done
          echo "ok: compose file and both Dockerfiles present"

      - name: are the build contexts here yet?
        id: contexts
        # The two contexts compose.yaml names. They arrive at STEP 4 of the assembly order in
        # RELEASE-SCOPE.md -- "source lands" -- which has not happened, so today both are
        # absent and this job has nothing to build. It says so by name rather than printing a
        # bare "skipping": a reader of this log should be able to tell "not assembled yet"
        # apart from "the build is broken" without opening another file.
        #
        # No condition anywhere needs editing when the source lands. The directories appear,
        # `present` flips to true, and the build step below starts gating.
        run: |
          set -euo pipefail
          missing=""
          for d in services/router services/portal; do
            if [ -d "$d" ]; then
              echo "present: $d"
            else
              echo "absent:  $d"
              missing="$missing $d"
            fi
          done

          if [ -n "$missing" ] && [ ! -d services/router ] && [ ! -d services/portal ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            msg="No image was built: neither build context exists yet."
            echo "$msg"
            echo "services/router/ and services/portal/ are assembled at STEP 4 of"
            echo "RELEASE-SCOPE.md (\"source lands\"), which is gated on step 3, the"
            echo "credential scrub. Until then \`docker compose build\` cannot reach any"
            echo "instruction in either Dockerfile: it stops while preparing the context,"
            echo "with a message that varies by Compose version -- \"unable to prepare"
            echo "context: path ... not found\" on v2, and a buildx privilege request for"
            echo "\`fs.read=../services\` on v5 -- so this job does not match on it."
            echo "That is the documented state of the tree, not a failure to debug, and it"
            echo "is why this job passes rather than fails."
            {
              echo "### build images: skipped"
              echo ""
              echo "$msg Both are assembled at **step 4** of RELEASE-SCOPE.md; this job"
              echo "becomes a real gate automatically when they appear, with no edit here."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "present=true" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "HALF-ASSEMBLED TREE: present contexts will be built, and compose will fail"
            echo "on the missing one(s):$missing. That failure is the correct outcome -- a"
            echo "stack with one of its two services unbuildable is not a stack."
          fi

      - name: build both images
        if: steps.contexts.outputs.present == 'true'
        # Built THROUGH COMPOSE rather than with `docker build`, deliberately. The thing most
        # likely to be wrong at step 5 is the wiring rather than either Dockerfile: compose.yaml
        # gives each service a context of ../services/<name> and a dockerfile of
        # ../../deploy/images/<name>/Dockerfile, i.e. a Dockerfile OUTSIDE its own build
        # context, resolved relative to the context. `docker build` would not exercise any of
        # that. RAMEAU_COMMIT is exported rather than passed with `--build-arg` for the same
        # reason: compose.yaml declares it as `${RAMEAU_COMMIT:-unknown}`, and that declaration
        # is the thing worth testing. `--build-arg` would bypass it, and would additionally be
        # offered to the portal, which declares no such ARG.
        #
        # No `docker compose up`: that needs the four runtime JSON files as real files and an
        # ollama on the host, neither of which a runner has. This job answers "do the images
        # build", which is the question step 5 asks first.
        env:
          # Same placeholder, and the same reason, as the `validate compose` step above:
          # RAMEAU_OLLAMA_URL is deliberately required with no default, so compose cannot
          # interpolate the file -- for `build` as much as for `up` -- without a value.
          # `.invalid` is reserved by RFC 2606 and can never resolve.
          RAMEAU_OLLAMA_URL: http://ollama.invalid:11434
        run: |
          set -euo pipefail
          export RAMEAU_COMMIT="$(git rev-parse --short HEAD)"
          echo "building with RAMEAU_COMMIT=$RAMEAU_COMMIT"
          docker compose -f deploy/compose.yaml build
          echo "both images built"
          docker image ls 'rameau/*'
