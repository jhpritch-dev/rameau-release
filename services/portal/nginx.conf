server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html: must revalidate every load so fresh bundle hashes reach clients
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # Hashed assets are immutable by Vite contract -- cache aggressively, 404 cleanly if missing
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ====================================================================
    # portal-fix-v1-h2 (2026-05-20): reverse-proxy locations for H2 architecture.
    # Portal bundle uses relative URLs (/router, /kb, /broadcaster, /arbiter,
    # /retriever, /dispatcher). nginx forwards to upstream services.
    # Solves Tailscale Failed-to-fetch by removing baked-in LAN IPs.
    # NOTE: /broadcaster/ and /arbiter/ currently timeout because k3d serverlb
    # does not expose host ports :8082 or :8092. Separate brief will expand.
    # ====================================================================

    # Router (Hearth k3d serverlb -> :30089 -> Router pod)
    location /router/ {
        proxy_pass http://host.docker.internal:8089/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_buffering off;  # required for SSE streaming on /v1/chat/completions
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # bifrost-kb (Hearth container :8091)
    location /kb/ {
        proxy_pass http://host.docker.internal:8091/;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # BROADCASTER (Hearth k3d :8092) - currently 504s; k3d port not exposed
    location /broadcaster/ {
        proxy_pass http://host.docker.internal:8092/;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # ARBITER (Hearth k3d :8082) - currently 504s; k3d port not exposed
    location /arbiter/ {
        proxy_pass http://host.docker.internal:8082/;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # ====================================================================
    # D13 (2026-10-16): the three routes below are BIFROST-side, and until today
    # they silently served HEARTH. `BIFROST_HOST` defaulted to
    # host.docker.internal -- the Docker host -- so /retriever/ rendered to the
    # same upstream as /broadcaster/ just above. Measured, not reasoned:
    # /retriever/system/status and /broadcaster/system/status returned
    # byte-identical live broadcaster payloads at HTTP 200. A wrong answer, not
    # an error.
    #
    # The obvious fix -- default BIFROST_HOST to something that is not Hearth --
    # is what D8 forbids, because nginx resolves a LITERAL proxy_pass host at
    # startup and dies with "host not found in upstream". That is the boot
    # failure D8 spent a whole entry on.
    #
    # Both are avoided by resolving these three at REQUEST time instead: a
    # proxy_pass through a VARIABLE is not resolved until a request arrives, so
    # an unconfigured BIFROST_HOST now yields a loud 502 on these routes while
    # nginx starts normally and every other route serves. D8's caution applies
    # to the literal form only; the variable form lifts it.
    #
    # Two things this costs, both deliberate:
    #   * `resolver` is required for variable upstreams. 127.0.0.11 is Docker's
    #     embedded DNS, present on any user-defined network -- which is what the
    #     compose project uses (`networks: [bifrost]`). On the default bridge
    #     there is no embedded DNS and these three routes would 502 always.
    #   * a variable proxy_pass does NOT strip the location prefix the way a
    #     trailing-slash literal does, so each route carries an explicit
    #     `rewrite ... break` reproducing exactly the old path mapping. These
    #     were verified against the real upstream, not assumed.
    # ====================================================================
    resolver 127.0.0.11 valid=30s ipv6=off;

    # inhouse_retriever (Bifrost :8092)
    location /retriever/ {
        # /retriever/foo -> /foo on the upstream, as the old trailing slash did
        set $up_retriever http://${BIFROST_HOST}:8092;
        rewrite ^/retriever/(.*)$ /$1 break;
        proxy_pass $up_retriever;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # dispatcher (Bifrost :8093)
    # 2026-05-23 504-fix: explicit proxy_read_timeout 1800s. Default 60s was
    # firing 504 to browser while dispatcher subprocess kept running (164s for
    # max_cycles=5 orchestrator; 425s for some). Match dispatcher's
    # SUBPROCESS_TIMEOUT_SEC=1800 ceiling so nginx is never the bottleneck.
    location /dispatcher/ {
        # /dispatcher/foo -> /foo on the upstream, as the old trailing slash did
        set $up_dispatcher http://${BIFROST_HOST}:8093;
        rewrite ^/dispatcher/(.*)$ /$1 break;
        proxy_pass $up_dispatcher;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # SPA fallback (no longer swallows /assets/* misses; falls through to /index.html for unmatched paths)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prometheus proxy with CORS (PRE-EXISTING; preserved)
    location /prom/ {
        proxy_pass http://host.docker.internal:9090/;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # GitHub webhook proxy to Bifrost Router (PRE-EXISTING; preserved)
    location /webhook/ {
        # /webhook/foo -> /webhook/foo. The old form's URI part was /webhook/,
        # which re-added the prefix it stripped, so this mapping is the identity
        # and the rewrite must put the prefix back.
        set $up_webhook http://${BIFROST_HOST}:8080;
        rewrite ^/webhook/(.*)$ /webhook/$1 break;
        proxy_pass $up_webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
        proxy_set_header X-GitHub-Event $http_x_github_event;
        proxy_read_timeout 10s;
    }
}
