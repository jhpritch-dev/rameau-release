# gitleaks configuration for rameau-release.
#
# WHY THIS FILE EXISTS. Measured 2026-11-03 against gitleaks 8.30.1 with the default
# ruleset: of eleven generated credential shapes, ten were flagged and `anthropic-key`
# was not, in twenty-four independent draws. gitleaks ships no Anthropic rule, so an
# `sk-ant-*` value committed here would pass the secret scan silently. That matters
# specifically for this repository: ANTHROPIC_API_KEY is live on the machine that
# authors this release (present in both User and Process scope), so the shape is one
# that can plausibly reach a working tree by accident.
#
# `useDefault = true` keeps every upstream rule; this file only ADDS.

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant-*)"
# Covers the api and admin key forms. The length window is wide on purpose: the exact
# body length is a vendor detail that can change, and a rule pinned to one length would
# silently stop matching when it did.
regex = '''\bsk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_\-]{80,160}\b'''
keywords = ["sk-ant-"]

# NO `entropy` THRESHOLD, DELIBERATELY.
#
# Entropy gating is what makes a generated canary an unreliable positive. Measured the
# same day: the default AWS rule flagged only 7 of 20 correctly-shaped generated keys --
# 35 % -- and entropy did not separate the hits from the misses (fired 3.406-3.875 bits
# over the random tail, missed 3.149-3.875, fully overlapping). An intermittent rule
# makes the control that proves the scanner fires fail at random, which teaches a reader
# to wave the failure through, and that is the moment a zero from the real scan stops
# being checked.
#
# The `sk-ant-` prefix plus an 80+ character body is specific enough on its own; there is
# no realistic false positive that this would catch and an entropy floor would exclude.
# So the rule is deterministic by construction, and tools/prove_scanner_fires.py reports
# the draw count that demonstrates it.
